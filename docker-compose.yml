version: '3.8'

services:
  # -----------------------------------------------------------
  # Message Broker & Result Store
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: devops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -----------------------------------------------------------
  # FastAPI Backend API Service
  # -----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-backend
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CORS_ORIGINS=*
      - PORT=8000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -----------------------------------------------------------
  # Celery Background Worker
  # -----------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-worker
    restart: unless-stopped
    command: ["celery", "-A", "worker.celery", "worker", "--loglevel=info"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_LOG_FILE=/app/logs/log_celery.txt
      - TASK_DURATION_SECONDS=10
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - worker_logs:/app/logs
    networks:
      - app-network

  # -----------------------------------------------------------
  # Frontend Web Client & Reverse Proxy
  # -----------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: devops-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  worker_logs:
    driver: local
