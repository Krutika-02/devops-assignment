name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # 1. Automated Testing & Code Quality
  # ============================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          pytest tests -v --tb=short

  # ============================================================================
  # 2. Container Build & Image Security
  # ============================================================================
  build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: devops-backend:latest
          load: true

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: devops-frontend:latest
          load: true

      - name: Test Docker Compose Startup
        run: |
          docker compose up -d
          sleep 12
          docker compose ps
          curl -f http://localhost:8000/health || exit 1
          docker compose down -v

  # ============================================================================
  # 3. Infrastructure as Code (AWS CDK) Validation & Synth
  # ============================================================================
  cdk-validate:
    name: AWS CDK Synth & Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js for CDK CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Set up Python for CDK App
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CDK Python Dependencies
        run: |
          cd cdk
          pip install -r requirements.txt

      - name: Run CDK Synth (Dry-Run CloudFormation Generation)
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          cd cdk
          cdk synth

  # ============================================================================
  # 4. Automated Cloud Deployment (Runs on merge to main)
  # ============================================================================
  deploy:
    name: Deploy to AWS ECS Fargate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, build, cdk-validate]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Images to Amazon ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/devops-backend:latest .
          docker push $REGISTRY/devops-backend:latest

          docker build -t $REGISTRY/devops-worker:latest .
          docker push $REGISTRY/devops-worker:latest

      - name: Deploy AWS CDK Stacks
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          cd cdk
          npm install -g aws-cdk
          pip install -r requirements.txt
          cdk deploy --all --require-approval never
